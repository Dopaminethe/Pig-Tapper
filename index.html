<!DOCTYPE html>

<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Pig Tapper Deluxe</title>

<style>

*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent}

body{min-height:100dvh;background:radial-gradient(ellipse at center,#1b4a20,#071008 70%);color:white;font-family:Arial,sans-serif;overflow:hidden}

button{font:inherit;cursor:pointer}

.app{height:100dvh;max-width:560px;margin:auto;padding:15px;display:flex;flex-direction:column;gap:12px}

header{display:flex;justify-content:space-between;align-items:center;gap:6px}

.brand{color:#a8ff86;font-weight:bold;letter-spacing:2px;font-size:13px}

.actions{display:flex;gap:7px}

.btn{border:1px solid #477e3b;background:#173b1b;color:white;border-radius:12px;padding:10px 9px;font-weight:bold;font-size:12px}

.score{text-align:center}

.label{font-size:12px;letter-spacing:3px;color:#a9e99a}

#score{font-size:53px;font-weight:1000;text-shadow:0 0 15px #39ff14}

.pills{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}

.pill{background:#15351a;border:1px solid #396c32;padding:7px 10px;border-radius:20px;font-size:12px}

.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}

.pig{width:min(88vw,390px);height:100%;max-height:440px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;touch-action:manipulation;transition:transform .08s;filter:drop-shadow(0 12px 16px #0008)}

.pig:active{transform:scale(.96)}

.pig img{width:100%;height:100%;object-fit:contain;pointer-events:none}

.hint{position:absolute;bottom:0;text-align:center;width:100%;font-size:12px;color:#c6e9bd;pointer-events:none}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.stat{background:#102514;border:1px solid #315d2e;border-radius:13px;padding:10px 4px;text-align:center}

.stat b{display:block;color:#a8ff86;font-size:17px}

.stat small{font-size:10px;color:#b5c8af}

.bottom{display:grid;grid-template-columns:1fr 1fr;gap:9px}

.action{padding:13px 5px;border:1px solid #5c9d46;border-radius:13px;background:linear-gradient(145deg,#2d7026,#174019);color:white;font-weight:bold}

.action.alt{background:#1b3020}

.float{position:fixed;pointer-events:none;color:#b6ff8a;font-size:25px;font-weight:bold;z-index:20;animation:fly .8s forwards}

.lucky{color:#ffe879}

@keyframes fly{to{transform:translateY(-80px) scale(1.4);opacity:0}}

.toast{position:fixed;top:15%;left:50%;transform:translate(-50%,-10px);opacity:0;pointer-events:none;background:#173b1b;border:1px solid #8dff54;border-radius:13px;padding:12px 16px;z-index:50;transition:.2s;text-align:center;max-width:90%}

.toast.show{opacity:1;transform:translate(-50%,0)}

.overlay{display:none;position:fixed;inset:0;background:#000d;z-index:30;align-items:center;justify-content:center;padding:14px}

.overlay.open{display:flex}

.modal{width:min(100%,460px);max-height:88dvh;overflow:auto;background:linear-gradient(145deg,#1b3d1e,#09130b);border:1px solid #7bdc54;border-radius:20px;padding:16px}

.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}

.modal h2{color:#b3ff94;font-size:19px}

.close{background:#542b2b;color:white;border:0;border-radius:9px;padding:8px 12px}

.wallet{background:#0b1b0d;padding:11px;border-radius:10px;margin-bottom:12px}

.section{font-size:11px;color:#a9ed91;letter-spacing:2px;margin:15px 0 9px;font-weight:bold}

.item{display:grid;grid-template-columns:55px 1fr auto;gap:9px;align-items:center;background:#102514;border:1px solid #315b2c;border-radius:12px;padding:8px;margin-bottom:8px}

.preview{width:55px;height:55px;overflow:hidden;display:flex;align-items:center;justify-content:center}

.preview img{width:100%;height:100%;object-fit:contain}

.iname{font-size:13px;font-weight:bold}.idesc{font-size:10px;color:#afc3a8;margin-top:4px}

.buy{background:#91ff5b;color:#10210d;border:0;border-radius:9px;padding:9px 8px;font-size:10px;font-weight:bold;min-width:72px}

.buy:disabled{background:#40513d;color:#ddd}

.upgrade{display:flex;justify-content:space-between;align-items:center;background:#102514;border:1px solid #315b2c;border-radius:12px;padding:11px;margin-bottom:8px;gap:8px}

.upgrade small{display:block;color:#b3c5ad;font-size:10px;margin-top:4px}

@media(max-height:700px){.app{gap:6px;padding:9px}.pig{max-height:330px}.score #score{font-size:43px}}

</style>

</head>

<script>

const $=id=>document.getElementById(id);

const pigSrc=$('pigPhoto').src;

const skins=[

{id:'classic',name:'Оригинальная',price:0,filter:'none'},

{id:'gold',name:'Золотая',price:250,filter:'sepia(1) saturate(3.5) hue-rotate(350deg)'},

{id:'ruby',name:'Рубиновая',price:500,filter:'hue-rotate(115deg) saturate(2.1)'},

{id:'ice',name:'Ледяная',price:1000,filter:'hue-rotate(155deg) saturate(1.5) brightness(1.15)'},

{id:'toxic',name:'Токсичная',price:2500,filter:'hue-rotate(35deg) saturate(2.8)'},

{id:'shadow',name:'Теневая',price:5000,filter:'brightness(.48) saturate(.6)'}];

let s={score:0,power:1,level:1,taps:0,combo:1,bestCombo:1,lastTap:0,owned:['classic'],selected:'classic',sound:true,luck:0,bonusTaken:false};

try{const saved=JSON.parse(localStorage.getItem('pigTapperDeluxe'));if(saved)s={...s,...saved}}catch(e){}

if(!Array.isArray(s.owned))s.owned=['classic'];

if(!s.owned.includes('classic'))s.owned.push('classic');

if(!skins.some(x=>x.id===s.selected)||!s.owned.includes(s.selected))s.selected='classic';

const fmt=n=>Math.floor(n).toLocaleString('ru-RU');

function save(){try{localStorage.setItem('pigTapperDeluxe',JSON.stringify(s))}catch(e){}}

function toast(m){const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.classList.remove('show'),1700)}

function applySkin(){const x=skins.find(a=>a.id===s.selected)||skins[0];$('pigPhoto').style.filter=x.filter==='none'?'none':x.filter}

function update(){

$('score').textContent=fmt(s.score);

$('powerLabel').textContent='👆 За тап: +'+s.power;

$('comboLabel').textContent='🔥 Комбо: x'+s.combo;

$('taps').textContent=fmt(s.taps);

$('bestCombo').textContent='x'+s.bestCombo;

$('skinsCount').textContent=s.owned.length+'/6';

$('wallet').textContent=fmt(s.score);

$('upgradeInfo').textContent='Уровень '+s.level+' · сила '+s.power;

$('buyUpgrade').textContent='КУПИТЬ · '+s.level*120;

$('buyLuck').textContent=s.luck>=3?'МАКС.':'КУПИТЬ · '+800*(s.luck+1);

$('soundBtn').textContent=s.sound?'🔊 ЗВУК':'🔇 ЗВУК';

applySkin();

}

let audio=null;

function clickSound(){

if(!s.sound)return;

try{

audio ||=new(window.AudioContext||window.webkitAudioContext)();

if(audio.state==='suspended')audio.resume();

const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();

o.type='triangle';

o.frequency.setValueAtTime(1750,t);

o.frequency.exponentialRampToValueAtTime(520,t+.035);

g.gain.setValueAtTime(.0001,t);

g.gain.exponentialRampToValueAtTime(.17,t+.002);

g.gain.exponentialRampToValueAtTime(.0001,t+.052);

o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.055);

const n=Math.floor(audio.sampleRate*.022),b=audio.createBuffer(1,n,audio.sampleRate),a=b.getChannelData(0);

for(let i=0;i<n;i++)a[i]=Math.random()*2-1;

const src=audio.createBufferSource(),f=audio.createBiquadFilter(),ng=audio.createGain();

src.buffer=b;f.type='highpass';f.frequency.value=2800;

ng.gain.setValueAtTime(.075,t);ng.gain.exponentialRampToValueAtTime(.0001,t+.023);

src.connect(f);f.connect(ng);ng.connect(audio.destination);src.start(t);

}catch(e){}

}

function popup(x,y,text,lucky){

const e=document.createElement('div');

e.className='float'+(lucky?' lucky':'');

e.textContent=text;e.style.left=x+'px';e.style.top=y+'px';

document.body.append(e);setTimeout(()=>e.remove(),850);

}

$('pig').addEventListener('pointerdown',e=>{

e.preventDefault();

const now=Date.now();

s.combo=now-s.lastTap<850?Math.min(10,s.combo+1):1;

s.lastTap=now;s.bestCombo=Math.max(s.bestCombo,s.combo);s.taps++;

const lucky=Math.random()<.035+s.luck*.035;

const earned=s.power*(s.combo>=5?2:1)*(lucky?5:1);

s.score+=earned;clickSound();

popup(e.clientX,e.clientY-20,'+'+earned,lucky);

if(lucky)toast('🍀 ЗОЛОТОЙ ТАП! x5!');

else if(s.combo===5)toast('🔥 КОМБО x2!');

update();save();

});

function renderShop(){

const list=$('skinList');list.innerHTML='';

skins.forEach(x=>{

const owned=s.owned.includes(x.id),selected=s.selected===x.id;

const row=document.createElement('div');row.className='item';

const prev=document.createElement('div');prev.className='preview';

const im=document.createElement('img');im.src=pigSrc;

im.style.filter=x.filter==='none'?'none':x.filter;prev.append(im);

const info=document.createElement('div');

info.innerHTML='<div class="iname"></div><div class="idesc"></div>';

info.querySelector('.iname').textContent=x.name;

info.querySelector('.idesc').textContent=owned?(selected?'Выбран':'Куплен'):x.price+' монет';

const btn=document.createElement('button');btn.className='buy';

btn.textContent=selected?'ВЫБРАН':owned?'НАДЕТЬ':'КУПИТЬ';

btn.disabled=selected;

btn.onclick=()=>{

if(owned){s.selected=x.id;toast('🎨 Скин надет!')}

else if(s.score>=x.price){s.score-=x.price;s.owned.push(x.id);s.selected=x.id;toast('🎉 Скин куплен!')}

else toast('😅 Не хватает монет');

save();update();renderShop();

};

row.append(prev,info,btn);list.append(row);

});

}

$('shopBtn').onclick=()=>{$('shopOverlay').classList.add('open');renderShop();update()};

$('closeShop').onclick=()=>$('shopOverlay').classList.remove('open');

$('shopOverlay').addEventListener('pointerdown',e=>{

if(e.target===$('shopOverlay'))$('shopOverlay').classList.remove('open');

});

$('soundBtn').onclick=()=>{

s.sound=!s.sound;save();update();

toast(s.sound?'🔊 Звук включён':'🔇 Звук выключен');

};

function upgrade(){

const price=s.level*120;

if(s.score<price){toast('😅 Не хватает '+fmt(price-s.score)+' монет');return}

s.score-=price;s.level++;s.power++;

toast('⚡ Сила тапа увеличена!');save();update();

}

$('upgradeBtn').onclick=upgrade;

$('buyUpgrade').onclick=()=>{upgrade();renderShop()};

$('buyLuck').onclick=()=>{

if(s.luck>=3){toast('🍀 Удача максимальная!');return}

const price=800*(s.luck+1);

if(s.score<price){toast('😅 Не хватает монет');return}

s.score-=price;s.luck++;

toast('🍀 Шанс удачи повышен!');save();update();renderShop();

};

$('bonusBtn').onclick=()=>{

if(s.bonusTaken){toast('🎁 Бонус уже забран!');return}

s.bonusTaken=true;s.score+=100;

toast('🎁 Подарок! +100 монет');save();update();

};

update();

</script>

<style>

#miniOverlay{position:fixed;inset:0;background:#080510f2;z-index:100;display:none;align-items:center;justify-content:center;padding:12px}

<script>

  // Новая валюта и улучшения
  if(typeof s.crystals!=='number')s.crystals=0;

  if(!s.crystalSkins)s.crystalSkins=['normal'];
  if(!s.crystalSkin)s.crystalSkin='normal';

  const crystalSkins=[
    {id:'normal',name:'Обычная',price:0,filter:null},
    {id:'purple',name:'Фиолетовая',price:100,filter:'hue-rotate(235deg) saturate(2)'},
    {id:'neon',name:'Неоновая',price:180,filter:'hue-rotate(70deg) saturate(3) brightness(1.2)'},
    {id:'rainbow',name:'Радужная',price:300,filter:'hue-rotate(140deg) saturate(2.5)'},
    {id:'dark',name:'Тёмная',price:450,filter:'brightness(.35) saturate(1.5)'}
  ];

  // Кнопки и баланс
  const header=document.querySelector('.actions');
  const miniButton=document.createElement('button');
  miniButton.className='btn';
  miniButton.textContent='🎮 ИГРЫ';
  header.insertBefore(miniButton,$('shopBtn'));

  const crystalPill=document.createElement('span');
  crystalPill.className='pill';
  crystalPill.id='crystalBar';
  crystalPill.textContent='💎 0';
  document.querySelector('.pills').append(crystalPill);

  const overlay=document.createElement('div');
  overlay.id='miniOverlay';
  overlay.innerHTML=`
    <div id="miniPanel">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <b style="color:#d8b5ff">🐷 PIG ARCADE</b>
        <button class="close" id="miniClose">✕</button>
      </div>
      <h2>🐦 Полёт свинки</h2>
      <div id="flightInfo">💎 За каждый пройденный столб: 5 кристаллов</div>
      <div style="margin:8px;color:#e5caff">Твой баланс: <b id="flightWallet">0</b> 💎</div>
      <canvas id="flightCanvas" width="360" height="540"></canvas>
      <div id="flightStatus" style="color:#e7d7ff;margin:8px">Нажми «СТАРТ», чтобы начать!</div>
      <button class="miniBtn" id="flightStart">▶ СТАРТ</button>
      <button class="miniBtn" id="flightShop">💎 МАГАЗИН</button>
      <div id="crystalShop">
        <h2>💜 Магазин кристаллов</h2>
        <div id="crystalItems"></div>
        <button class="miniBtn" id="shopBack">НАЗАД К ИГРЕ</button>
      </div>
      <div style="font-size:11px;color:#bda9d8;margin-top:8px">
        Нажимай на экран, чтобы свинка взлетала!
      </div>
    </div>`;
  document.body.append(overlay);

  const canvas=$('flightCanvas');
  const ctx=canvas.getContext('2d');
  const W=360,H=540;
  let running=false,started=false,raf=0;
  let bird, pipes, frames, passed, shieldUsed, lastFrame;
  const gravity=.34, flap=-6.2, pipeWidth=62, gap=158;

  function updateCrystals(){
    crystalPill.textContent='💎 '+fmt(s.crystals);
    $('flightWallet').textContent=fmt(s.crystals);
  }

  const oldUpdate=update;
  update=function(){
    oldUpdate();
    updateCrystals();
    const crystalSkin=crystalSkins.find(x=>x.id===s.crystalSkin);
    if(crystalSkin && crystalSkin.filter)$('pigPhoto').style.filter=crystalSkin.filter;
  };

  function drawBackground(){
    const sky=ctx.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,'#64c9ff');
    sky.addColorStop(1,'#d4f5ff');
    ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.globalAlpha=.8;
    [[65,90],[265,145],[170,45]].forEach(([x,y])=>{
      ctx.beginPath();ctx.arc(x,y,20,0,Math.PI*2);ctx.arc(x+22,y+3,17,0,Math.PI*2);ctx.arc(x-20,y+7,14,0,Math.PI*2);ctx.fill();
    });
    ctx.globalAlpha=1;
    ctx.fillStyle='#74c94e';ctx.fillRect(0,H-35,W,35);
    ctx.fillStyle='#3f9d36';ctx.fillRect(0,H-35,W,6);
  }

  function drawPipe(p){
    const grad=ctx.createLinearGradient(p.x,0,p.x+pipeWidth,0);
    grad.addColorStop(0,'#176d26');grad.addColorStop(.5,'#63d94b');grad.addColorStop(1,'#247d2c');
    ctx.fillStyle=grad;
    ctx.fillRect(p.x,0,pipeWidth,p.top);
    ctx.fillRect(p.x,p.top-18,pipeWidth,18);
    const bottomY=p.top+gap;
    ctx.fillRect(p.x,bottomY,pipeWidth,H-bottomY-35);
    ctx.fillRect(p.x,bottomY,pipeWidth,18);
    ctx.strokeStyle='#15551e';ctx.lineWidth=3;
    ctx.strokeRect(p.x,0,pipeWidth,p.top);
    ctx.strokeRect(p.x,bottomY,pipeWidth,H-bottomY-35);
  }

  function drawBird(){
    ctx.save();
    ctx.translate(bird.x,bird.y);
    ctx.rotate(Math.max(-.45,Math.min(.7,bird.vy*.055)));
    ctx.font='42px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('🐷',0,0);
    ctx.restore();
  }

  function newGame(){
    cancelAnimationFrame(raf);
    bird={x:90,y:245,vy:0,r:17};
    pipes=[];
    frames=0;passed=0;shieldUsed=false;
    started=true;running=true;lastFrame=0;
    $('flightStatus').textContent='💎 Кристаллы за пролёты: 0';
    $('flightStart').textContent='🔄 ЗАНОВО';
    addPipe(0);
    raf=requestAnimationFrame(loop);
  }

  function addPipe(x){
    const top=95+Math.random()*235;
    pipes.push({x,top,scored:false});
  }

  function flapBird(){
    if(!running){
      if(!started)newGame();
      return;
    }
    bird.vy=flap;
  }

  function collision(p){
    const bx=bird.x,by=bird.y,r=bird.r;
    if(by-r<0||by+r>H-35)return true;
    if(bx+r>p.x&&bx-r<p.x+pipeWidth){
      if(by-r<p.top||by+r>p.top+gap)return true;
    }
    return false;
  }

  function endGame(){
    running=false;started=false;
    $('flightStatus').textContent='💥 Игра окончена! Пролётов: '+passed+'. Нажми «ЗАНОВО».';
    $('flightStart').textContent='🔄 ИГРАТЬ СНОВА';
  }

  function loop(time){
    if(!running)return;
    const dt=Math.min((time-lastFrame)/16.67||1,2);
    lastFrame=time;
    frames+=dt;
    bird.vy+=gravity*dt;
    bird.y+=bird.vy*dt;
    pipes.forEach(p=>{
      p.x-=2.5*dt;
      if(!p.scored&&p.x+pipeWidth<bird.x){
        p.scored=true;passed++;
        const reward=5*s.flightMultiplier;
        s.crystals+=reward;
        $('flightStatus').textContent='💎 Пролётов: '+passed+' · +' + reward+' кристаллов';
        save();updateCrystals();
      }
    });
    if(pipes.length&&pipes[0].x<-pipeWidth)pipes.shift();
    if(pipes.length===0||pipes[pipes.length-1].x<205)addPipe(W+10);

    let hit=pipes.some(collision);
    if(hit){
      if(s.flightShield>0&&!shieldUsed){
        shieldUsed=true;
        bird.vy=-4;
        bird.y=Math.max(50,Math.min(H-70,bird.y));
        toast('🛡️ Щит спас тебя!');
      }else{
        drawBackground();pipes.forEach(drawPipe);drawBird();endGame();return;
      }
    }
    drawBackground();
    pipes.forEach(drawPipe);
    drawBird();
    ctx.fillStyle='#30134d';ctx.font='bold 22px Arial';ctx.textAlign='left';
    ctx.fillText('💎 '+s.crystals,14,32);
    raf=requestAnimationFrame(loop);
  }

  canvas.addEventListener('pointerdown',e=>{
    e.preventDefault();
    if(!running){if(!started)newGame();else return;}
    flapBird();
  });
  $('flightStart').onclick=newGame;

  function renderCrystalShop(){
    $('crystalItems').innerHTML='';
    crystalSkins.forEach(item=>{
      const owned=s.crystalSkins.includes(item.id);
      const selected=s.crystalSkin===item.id;
      const row=document.createElement('div');
      row.className='crystalItem';
      const info=document.createElement('div');
      info.innerHTML='<b></b><small></small>';
      info.querySelector('b').textContent='🐷 '+item.name;
      info.querySelector('small').textContent=owned?(selected?'Выбран':'Куплен'):item.price+' 💎';
      const btn=document.createElement('button');
      btn.textContent=selected?'ВЫБРАН':owned?'НАДЕТЬ':'КУПИТЬ';
      btn.disabled=selected;
      btn.onclick=()=>{
        if(owned){
          s.crystalSkin=item.id;
          toast('🎨 Скин надет!');
        }else if(s.crystals>=item.price){
          s.crystals-=item.price;
          s.crystalSkins.push(item.id);
          s.crystalSkin=item.id;
          toast('💜 Новый скин куплен!');
        }else toast('Не хватает кристаллов!');
        save();update();renderCrystalShop();
      };
      row.append(info,btn);$('crystalItems').append(row);
    });

    const upgrades=[
      {name:'🛡️ Щит',desc:'Один раз спасает от столкновения',price:80,action:()=>s.flightShield++ ,level:s.flightShield},
      {name:'💎 Двойная награда',desc:'Вдвое больше кристаллов за столб',price:150,action:()=>s.flightMultiplier=2,level:s.flightMultiplier===2?1:0}
    ];
    upgrades.forEach(u=>{
      const row=document.createElement('div');row.className='crystalItem';
      const info=document.createElement('div');
      info.innerHTML='<b></b><small></small>';
      info.querySelector('b').textContent=u.name;
      info.querySelector('small').textContent=u.desc+(u.name.includes('Щит')?' · В запасе: '+u.level:u.level?' · Куплено':'');
      const btn=document.createElement('button');
      btn.textContent=u.level?'ЕСТЬ':'КУПИТЬ · '+u.price+' 💎';
      btn.disabled=!!u.level;
      btn.onclick=()=>{
        if(s.crystals<u.price){toast('Не хватает кристаллов!');return;}
        s.crystals-=u.price;u.action();
        save();update();renderCrystalShop();toast('✨ Улучшение куплено!');
      };
      row.append(info,btn);$('crystalItems').append(row);
    });
  }

  miniButton.onclick=()=>{
    overlay.classList.add('open');
    updateCrystals();
  };
  $('miniClose').onclick=()=>{
    overlay.classList.remove('open');
    running=false;started=false;cancelAnimationFrame(raf);
  };
  $('flightShop').onclick=()=>{
    $('crystalShop').style.display='block';
    $('flightCanvas').style.display='none';
    $('flightStatus').style.display='none';
    $('flightStart').style.display='none';
    $('flightShop').style.display='none';
    renderCrystalShop();
  };
  $('shopBack').onclick=()=>{
    $('crystalShop').style.display='none';
    $('flightCanvas').style.display='block';
    $('flightStatus').style.display='block';
    $('flightStart').style.display='inline-block';
    $('flightShop').style.display='inline-block';
    updateCrystals();
  };

  update();
})();
</script>
</body>
